project.buildDir = ".build"
wrapper.jarFile = ".gradle/wrapper/gradle-wrapper.jar"

// Configure Java toolchain for all subprojects
subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(22)
            vendor = JvmVendorSpec.AMAZON
        }
    }

    compileJava {
        options.release = 22
    }

    compileTestJava {
        options.release = 22
    }
}

ext {
    springboot_version = "3.3.4"  // Updated to support Java 22
    hibernate_version = "6.6.15.Final"  // Updated to support Java 22
    major = "1"
    minor = ".0"
    patch = "-SNAPSHOT"
}

group 'strata.server'
version "$major$minor$patch"