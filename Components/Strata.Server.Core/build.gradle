plugins {
    id 'java-library'
}


sourceSets {
    main.java.srcDirs = ['main/java']
    main.resources.srcDirs = ['main/resources']
}

apply plugin: 'maven-publish'

group 'strata.server'
version "$major$minor$patch"

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
}

publishing {
    publications {
        StrataServerCore(MavenPublication) {
            artifactId = 'strata-server-core'
            from components.java

            repositories {
                maven {
                    name "GitHubPackages"
                    url "https://maven.pkg.github.com/StrataFrameworkSet/repository"
                    credentials {
                        username = "$System.env.REPOSITORY_USER"
                        password = "$System.env.REPOSITORY_PASSWORD"
                    }
                }
            }
        }
    }
}

dependencies {
    api "strata.foundation:strata-foundation-core:$version"
    api "jakarta.persistence:jakarta.persistence-api:$jakarta_persistence_version"
    api "jakarta.transaction:jakarta.transaction-api:$jakarta_transaction_version"
    api "org.modelmapper:modelmapper:$modelmapper_version"
    implementation "org.apache.commons:commons-lang3:$apache_commons_lang_version"  // Updated for Java 22 compatibility
    implementation "com.telesign:telesign:$telesign_version"
    implementation "jakarta.mail:jakarta.mail-api:$jakarta_mail_api_version"
    implementation "org.eclipse.angus:jakarta.mail:$jakarta_mail_impl_version"
}