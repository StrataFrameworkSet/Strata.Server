plugins {
    id 'java-library'
}

sourceSets {
    main.java.srcDirs = ['src/main/java']
    main.resources.srcDirs = ['src/main/resources']
    test.java.srcDirs = ['src/unused']
    test.resources.srcDirs = ['src/unused']
}

apply plugin: 'maven-publish'

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
}

publishing {
    publications {
        StrataServerWebSocket(MavenPublication) {
            artifactId = 'strata-server-websocket'
            from components.java

            repositories {
                maven {
                    name "GitHubPackages"
                    url "https://maven.pkg.github.com/StrataFrameworkSet/repository"
                    credentials {
                        username = "$System.env.REPOSITORY_USER"
                        password = "$System.env.REPOSITORY_PASSWORD"
                    }
                }
            }
        }
    }
}

dependencies {
    api project(':Components:Strata.Server.Core')
    api "jakarta.websocket:jakarta.websocket-api:$jakarta_websocket_version"
    implementation "org.eclipse.jetty.websocket:websocket-jakarta-server:$eclipse_websocket_version"
}