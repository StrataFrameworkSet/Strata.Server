plugins {
    id 'java-library'
}


sourceSets {
    main.java.srcDirs = ['src/main/java']
    main.resources.srcDirs = ['src/main/resources']
}

apply plugin: 'maven-publish'

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
}

publishing {
    publications {
        StrataServerSpring(MavenPublication) {
            artifactId = 'strata-server-spring'
            from components.java

            repositories {
                maven {
                    name "GitHubPackages"
                    url "https://maven.pkg.github.com/StrataFrameworkSet/repository"
                    credentials {
                        username = "$System.env.REPOSITORY_USER"
                        password = "$System.env.REPOSITORY_PASSWORD"
                    }
                }
            }
        }
    }
}

dependencies {
    api project(":Components:Strata.Server.Core")
    api "strata.foundation:strata-foundation-spring:$strata_foundation_version"
    api "strata.foundation:strata-foundation-guice:$strata_foundation_version"
    api "org.springframework.boot:spring-boot-starter-web:$springboot_version"
    api "org.springframework.boot:spring-boot-starter-webflux:$springboot_version"
    api "org.springframework.boot:spring-boot-starter-data-jpa:$springboot_version"
    api "org.springframework.boot:spring-boot-autoconfigure:$springboot_version"
    //api "org.springframework.data:spring-data-jpa:$spring_data_jpa_version"
    api "org.springdoc:springdoc-openapi-starter-webmvc-ui:$springdoc_version"  // Updated for Java 22 compatibility
    api "org.springframework.guice:spring-guice:$spring_guice_version"
    //api "jakarta.inject:jakarta.inject-api:$jakarta_inject_version"
    api "io.smallrye:jandex:$jandex_version"
    api "com.mchange:c3p0:$c3p0_version"
    api "org.hibernate.orm:hibernate-c3p0:$hibernate_version"
    //api "org.reactivestreams:reactive-streams:$reactive_streams_version"
}