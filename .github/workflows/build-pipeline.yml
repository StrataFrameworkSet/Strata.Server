name: Build-Pipeline
on:
  push:
    branches: [ development, 'release-*' ]
  pull_request:
    branches: [ development, 'release-*' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  PROPERTIES_ENCRYPTION_KEY: ${{secrets.PROPERTIES_ENCRYPTION_KEY}}
  REPOSITORY_USER: ${{vars.REPOSITORY_USER}}
  REPOSITORY_PASSWORD: ${{secrets.REPOSITORY_PASSWORD}}
  DOCKER_USER: ${{vars.DOCKER_USER}}
  DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}

jobs:
  prepare-build-tag:
    runs-on: ubuntu-latest
    outputs:
      BUILD_IMAGE_TAG: ${{ steps.tag.outputs.BUILD_IMAGE_TAG }}
      BUILD_GIT_SHA: ${{ steps.tag.outputs.BUILD_GIT_SHA }}
      BUILD_CREATED: ${{ steps.tag.outputs.BUILD_CREATED }}
      BUILD_USER: ${{ steps.tag.outputs.BUILD_USER }}
    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Compute build image tag
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then echo "Pull request: no image is published"; exit 0; fi
          gradle_value() { sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"\([^\"]*\)\".*/\1/p" build.gradle | head -n 1; }
          VERSION="$(gradle_value major)$(gradle_value minor)$(gradle_value patch)"
          VERSION="${VERSION%-SNAPSHOT}"
          [ -n "$VERSION" ] || { echo "ERROR: cannot read the version from build.gradle"; exit 1; }
          BUILD_IMAGE_TAG="$VERSION-$(date -u +%Y%m%d%H%M%S)"
          VERSION_PATTERN="$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')"
          echo "$BUILD_IMAGE_TAG" | grep -Eq "^$VERSION_PATTERN-[0-9]{14}\$" || { echo "ERROR: invalid build tag '$BUILD_IMAGE_TAG'"; exit 1; }
          {
            echo "BUILD_IMAGE_TAG=$BUILD_IMAGE_TAG"
            echo "BUILD_GIT_SHA=$GITHUB_SHA"
            echo "BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BUILD_USER=$GITHUB_ACTOR"
          } | tee -a "$GITHUB_OUTPUT"

  run-commit-stage:
    runs-on: ubuntu-latest
    needs: prepare-build-tag
    env:
      BUILD_IMAGE_TAG: ${{ needs.prepare-build-tag.outputs.BUILD_IMAGE_TAG }}
      BUILD_GIT_SHA: ${{ needs.prepare-build-tag.outputs.BUILD_GIT_SHA }}
      BUILD_CREATED: ${{ needs.prepare-build-tag.outputs.BUILD_CREATED }}
      BUILD_USER: ${{ needs.prepare-build-tag.outputs.BUILD_USER }}
    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'corretto'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@ccb4328a959376b642e027874838f60f8e596de3

      - name: Chmod GradleW
        run: chmod a+x gradlew

      - name: Build with Gradle
        uses: gradle/gradle-build-action@749f47bda3e44aa060e82d7b3ef7e40d953bd629
        with:
          gradle-executable: gradlew
          arguments: build

      - name: Save Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/build/libs/*.jar
          retention-days: 1

      - name: Publish Test Report (Commit Stage)
        uses: mikepenz/action-junit-report@v3
        if: success() || failure() # always run even if the previous step fails
        with:
            report_paths: '**/build/test-results/test/TEST-*.xml'

  run-integration-stage:
    runs-on: ubuntu-latest
    needs: [prepare-build-tag, run-commit-stage]
    if: needs.prepare-build-tag.outputs.BUILD_IMAGE_TAG != ''
    env:
      IMAGE: ghcr.io/johnliebenau/strata/strata-server-testsuite:${{ needs.prepare-build-tag.outputs.BUILD_IMAGE_TAG }}
    steps:
      - name: Integration Tests (placeholder)
        run: echo "Strata.Server.TestSuite is not enabled; no integration tests run for $IMAGE"

      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v2

      #- name: Login to GitHub Container Registry
      #  uses: docker/login-action@v2
      #  with:
      #    registry: ghcr.io
      #    username: ${{vars.REPOSITORY_USER}}
      #    password: ${{secrets.REPOSITORY_PASSWORD}}

      #- name: Pull Docker image
      #  run: docker pull "$IMAGE"

      #- name: Run Integration Tests
      #  run: |
      #    docker run --rm "$IMAGE" \
      #      --package=strata.server --tags=IntegrationStage

  run-acceptance-stage:
    runs-on: ubuntu-latest
    needs: [prepare-build-tag, run-integration-stage]
    if: needs.prepare-build-tag.outputs.BUILD_IMAGE_TAG != ''
    env:
      IMAGE: ghcr.io/johnliebenau/strata/strata-server-testsuite:${{ needs.prepare-build-tag.outputs.BUILD_IMAGE_TAG }}
    steps:
      - name: Acceptance Tests (placeholder)
        run: echo "Strata.Server.TestSuite is not enabled; no acceptance tests run for $IMAGE"

      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v2

      #- name: Login to GitHub Container Registry
      #  uses: docker/login-action@v2
      #  with:
      #    registry: ghcr.io
      #    username: ${{vars.REPOSITORY_USER}}
      #    password: ${{secrets.REPOSITORY_PASSWORD}}

      #- name: Pull Docker image
      #  run: docker pull "$IMAGE"

      #- name: Run Acceptance Tests
      #  run: |
      #    docker run --rm "$IMAGE" \
      #      --package=strata.server --tags=AcceptanceStage

  run-deploy-stage:
    runs-on: ubuntu-latest
    needs: run-acceptance-stage
    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'corretto'

      - name: Chmod GradleW
        run: chmod a+x gradlew

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Publish Build Artifacts
        uses: gradle/gradle-build-action@749f47bda3e44aa060e82d7b3ef7e40d953bd629
        with:
          gradle-executable: gradlew
          arguments: publishAllPublicationsToGitHubPackagesRepository -x test -x build -x jar -x compileJava -x processResources -x classes -x testFixturesJar -x testClasses -x testFixturesClasses
