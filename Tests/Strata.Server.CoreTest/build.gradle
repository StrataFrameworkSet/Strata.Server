plugins {
    id 'java-library'
    id 'java-test-fixtures'
}


sourceSets {
    test.java.srcDirs = ['src/test/java']
    test.resources.srcDirs = ['src/test/resources']
    testFixtures.java.srcDirs = ['src/testFixtures/java']
    testFixtures.resources.srcDirs = ['src/testFixtures/resources']
}

dependencies {
    api project(':Components:Strata.Server.Core')
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.3'  // Updated for Java 22 compatibility
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.3'

    testFixturesApi project(':Components:Strata.Server.Core')
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.3'
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.3'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.3'
}

test {
    useJUnitPlatform {
        includeTags("CommitStage")
    }
}